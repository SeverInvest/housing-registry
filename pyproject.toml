[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["registry/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "housing_registry.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
