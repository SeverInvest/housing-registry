services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      # Collect static files at startup, when DJANGO_SECRET_KEY is available.
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY manage.py ./
        COPY housing_registry/ ./housing_registry/
        COPY registry/ ./registry/
        EXPOSE 8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: postgresql
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && exec gunicorn housing_registry.wsgi:application --bind 0.0.0.0:8000 --workers 2"

volumes:
  postgres_data:
